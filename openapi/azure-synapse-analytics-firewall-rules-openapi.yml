openapi: 3.1.0
info:
  title: Azure Synapse Analytics - Firewall Rules API
  description: >-
    Manage IP firewall rules for Synapse workspaces to control network access.
    Supports creating, updating, and deleting server-level IP firewall rules
    for workspace security.
  version: '2021-06-01'
  contact:
    name: Microsoft Azure Support
    url: https://azure.microsoft.com/en-us/support/
  license:
    name: Microsoft
    url: https://azure.microsoft.com/en-us/support/legal/
servers:
  - url: https://management.azure.com
    description: Azure Resource Manager
security:
  - azure_auth:
      - user_impersonation
paths:
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Synapse/workspaces/{workspaceName}/firewallRules:
    get:
      operationId: IpFirewallRules_ListByWorkspace
      summary: List firewall rules
      description: Returns a list of firewall rules.
      tags:
        - IpFirewallRules
      parameters:
        - $ref: '#/components/parameters/ApiVersionParameter'
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/WorkspaceNameParameter'
      responses:
        '200':
          description: Successfully retrieved the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpFirewallRuleInfoListResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Synapse/workspaces/{workspaceName}/firewallRules/{ruleName}:
    get:
      operationId: IpFirewallRules_Get
      summary: Get a firewall rule
      description: Get a firewall rule.
      tags:
        - IpFirewallRules
      parameters:
        - $ref: '#/components/parameters/ApiVersionParameter'
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/WorkspaceNameParameter'
        - name: ruleName
          in: path
          required: true
          description: The IP firewall rule name.
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved the firewall rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpFirewallRuleInfo'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: IpFirewallRules_CreateOrUpdate
      summary: Create or update a firewall rule
      description: Creates or updates a firewall rule.
      tags:
        - IpFirewallRules
      parameters:
        - $ref: '#/components/parameters/ApiVersionParameter'
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/WorkspaceNameParameter'
        - name: ruleName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpFirewallRuleInfo'
      responses:
        '200':
          description: Successfully updated the firewall rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpFirewallRuleInfo'
        '201':
          description: Successfully created the firewall rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpFirewallRuleInfo'
        '202':
          description: Firewall rule creation accepted.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: IpFirewallRules_Delete
      summary: Delete a firewall rule
      description: Deletes a firewall rule.
      tags:
        - IpFirewallRules
      parameters:
        - $ref: '#/components/parameters/ApiVersionParameter'
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/WorkspaceNameParameter'
        - name: ruleName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpFirewallRuleInfo'
        '202':
          description: Deletion accepted.
        '204':
          description: Not found.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Synapse/workspaces/{workspaceName}/replaceAllIpFirewallRules:
    post:
      operationId: IpFirewallRules_ReplaceAll
      summary: Replace all firewall rules
      description: Replaces firewall rules.
      tags:
        - IpFirewallRules
      parameters:
        - $ref: '#/components/parameters/ApiVersionParameter'
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/WorkspaceNameParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAllIpFirewallRulesRequest'
      responses:
        '200':
          description: Successfully replaced firewall rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceAllFirewallRulesOperationResponse'
        '202':
          description: Replace accepted.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      schema:
        type: string
        default: '2021-06-01'
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      schema:
        type: string
    WorkspaceNameParameter:
      name: workspaceName
      in: path
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    IpFirewallRuleInfoListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/IpFirewallRuleInfo'
        nextLink:
          type: string
    IpFirewallRuleInfo:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        properties:
          type: object
          properties:
            endIpAddress:
              type: string
              description: The end IP address of the firewall rule (IPv4 format).
            provisioningState:
              type: string
              readOnly: true
              enum:
                - Provisioning
                - Succeeded
                - Deleting
                - Failed
                - DeleteError
            startIpAddress:
              type: string
              description: The start IP address of the firewall rule (IPv4 format).
    ReplaceAllIpFirewallRulesRequest:
      type: object
      properties:
        ipFirewallRules:
          type: object
          additionalProperties:
            type: object
            properties:
              startIpAddress:
                type: string
              endIpAddress:
                type: string
    ReplaceAllFirewallRulesOperationResponse:
      type: object
      properties:
        operationId:
          type: string
