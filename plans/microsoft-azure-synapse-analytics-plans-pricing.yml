specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Azure Synapse Analytics
providerId: microsoft-azure-synapse-analytics
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Analytics
  - Apache Spark
  - Big Data
  - Data Integration
  - Data Warehouse
  - ETL
  - SQL
description: Azure Synapse Analytics is consumption-priced per compute resource family —
  Dedicated SQL Pool (DWU-hour, hourly), Serverless SQL Pool (per TB processed), Apache Spark
  Pool (vCore-hour), and Data Integration / Pipelines (per orchestration activity-run +
  per-DIU-hour). Storage is billed separately via Azure Data Lake Storage Gen2. Reserved
  capacity discounts of up to ~65% available for 1-year and 3-year commitments on Dedicated
  SQL Pools. Microsoft is steering new workloads to Microsoft Fabric.
sources:
  - https://azure.microsoft.com/en-us/pricing/details/synapse-analytics/
  - https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-what-is
plans:
  - id: microsoft-azure-synapse-dedicated-sql
    name: Dedicated SQL Pool (DWU)
    type: usage-based
    description: Provisioned data warehouse compute billed per DWU-hour. Sizes from DW100c to
      DW30000c. Storage billed separately at $122.88 per TB per month.
    entries:
      - label: DW100c (100 DWU)
        name: dw100c_hour
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$1.51 per hour'
        userMultiplied: false
      - label: DW1000c (1000 DWU)
        name: dw1000c_hour
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$15.10 per hour'
        userMultiplied: false
      - label: DW30000c (30000 DWU)
        name: dw30000c_hour
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$453.06 per hour'
        userMultiplied: false
      - label: Storage
        name: dwh_storage
        type: metered
        metric: TB-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '$122.88 per TB per month'
        userMultiplied: false
    elements:
      - name: Pause / resume to save cost
      - name: 1-year and 3-year reserved capacity
      - name: Geo-redundant backups
  - id: microsoft-azure-synapse-serverless-sql
    name: Serverless SQL Pool
    type: usage-based
    description: Pay per TB of data processed by ad-hoc queries on data lake. No provisioning;
      fully managed.
    entries:
      - label: Per TB processed
        name: serverless_tb
        type: metered
        metric: TB
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$5.00 per TB processed'
        userMultiplied: false
    elements:
      - name: Query data lake without ETL
      - name: T-SQL syntax over Parquet/CSV/JSON
      - name: No infrastructure to manage
  - id: microsoft-azure-synapse-spark
    name: Apache Spark Pool
    type: usage-based
    description: Apache Spark compute billed per vCore-hour. Memory-optimized node sizes from
      Small (4 vCore) to XXLarge (64 vCore). Auto-pause idle pools to control cost.
    entries:
      - label: Memory-optimized vCore-hour
        name: spark_memory_vcore_hour
        type: metered
        metric: vcore-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.143 per vCore per hour'
        userMultiplied: false
    elements:
      - name: Auto-pause to stop billing
      - name: Auto-scale executors
      - name: Optimized for memory-intensive workloads
  - id: microsoft-azure-synapse-pipelines
    name: Data Integration / Pipelines
    type: usage-based
    description: Mirrors Azure Data Factory pricing. Billed per orchestration activity-run, per
      data integration unit (DIU)-hour for data movement, and per Spark execution hour.
    entries:
      - label: Orchestration activity run (Azure IR)
        name: pipeline_activity_run
        type: metered
        metric: 1000-runs
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000
        price: '$1.00 per 1,000 runs'
        userMultiplied: false
      - label: Data movement (per DIU-hour)
        name: pipeline_diu_hour
        type: metered
        metric: diu-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.25 per DIU-hour'
        userMultiplied: false
      - label: Pipeline activity execution (per hour)
        name: pipeline_execution_hour
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.005 per hour'
        userMultiplied: false
    elements:
      - name: Visual pipeline designer
      - name: 90+ source/sink connectors
      - name: Mapping and wrangling data flows
  - id: microsoft-azure-synapse-reserved
    name: Reserved Capacity (1y / 3y)
    type: enterprise
    description: Pre-commit to dedicated SQL pool DWU capacity for 1-year or 3-year terms;
      ~37% / ~65% off pay-as-you-go.
    entries:
      - label: Reserved DWU (negotiated)
        name: reserved_dwu
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom (1y ~37% off, 3y ~65% off)
        userMultiplied: false
    elements:
      - name: Discount up to 65%
      - name: Auto-renew option
      - name: Enterprise Agreement bundling
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://azure.microsoft.com/services/synapse-analytics/
